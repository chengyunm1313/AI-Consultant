name: Hexo Build & Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hexo-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.1"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Verify post dates
        run: npm run verify:post-dates

      - name: Build
        run: npm run build

      - name: Upload public artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public
          path: public
          if-no-files-found: error
          retention-days: 1

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download public artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: public
          path: ${{ runner.temp }}/public-site

      - name: Deploy to gh-pages
        env:
          CNAME_DOMAIN: blog.es2idea.com
        run: |
          set -e

          DEPLOY_DIR="$(mktemp -d)"
          cp -R "$RUNNER_TEMP/public-site"/. "$DEPLOY_DIR"/
          echo "$CNAME_DOMAIN" > "$DEPLOY_DIR/CNAME"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . || true
          fi

          git rm -rf . || true
          cp -R "$DEPLOY_DIR"/. .
          rm -rf "$DEPLOY_DIR"
          touch .nojekyll

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to deploy."
            exit 0
          fi

          git commit -m "chore: deploy $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin gh-pages
