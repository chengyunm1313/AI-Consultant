---
layout: false
---
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>享哥 AI 虛擬助理</title>
<style>
  :root {
    --ink: #172033;
    --muted: #667085;
    --line: rgba(23, 32, 51, .12);
    --surface: rgba(255, 255, 255, .96);
    --panel: rgba(17, 24, 39, .76);
    --accent: #2563eb;
    --accent-strong: #1d4ed8;
    --success: #0f766e;
  }

  * { box-sizing: border-box; }

  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
    color: var(--ink);
    font-family: "Noto Sans TC", "Noto Sans", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }

  #assistant-avatar {
    appearance: none;
    position: absolute;
    z-index: 1;
    right: 86px;
    bottom: 58px;
    width: 206px;
    height: 286px;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    cursor: pointer;
    transform-origin: 50% 100%;
    animation: avatar-idle 5.6s ease-in-out infinite;
    pointer-events: auto;
  }

  #assistant-avatar svg {
    width: 100%;
    height: 100%;
    display: block;
    overflow: visible;
    filter: drop-shadow(0 18px 24px rgba(17, 24, 39, .18));
  }

  .avatar-head {
    transform-origin: 150px 126px;
    animation: avatar-head-idle 4.8s ease-in-out infinite;
  }

  .avatar-eye {
    transform-origin: center;
    animation: avatar-blink 5.2s infinite;
  }

  .avatar-mouth {
    transform-origin: 150px 153px;
    transition: transform .12s ease, opacity .12s ease;
  }

  .avatar-mouth-open {
    opacity: 0;
    transform: scaleY(.3);
  }

  body.speaking #assistant-avatar {
    animation-duration: 2.4s;
  }

  body.speaking .avatar-head {
    animation: avatar-speaking-head .7s ease-in-out infinite;
  }

  body.speaking .avatar-mouth-closed {
    opacity: 0;
  }

  body.speaking .avatar-mouth-open {
    opacity: 1;
    animation: avatar-talk .18s ease-in-out infinite alternate;
  }

  body.listening .avatar-listen-ring {
    opacity: .55;
    animation: avatar-pulse 1.2s ease-out infinite;
  }

  .avatar-listen-ring {
    opacity: 0;
    transform-origin: 150px 142px;
  }

  @keyframes avatar-idle {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  @keyframes avatar-head-idle {
    0%, 100% { transform: rotate(0deg); }
    48% { transform: rotate(-1.4deg); }
    58% { transform: rotate(1.1deg); }
  }

  @keyframes avatar-speaking-head {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(2px) rotate(.8deg); }
  }

  @keyframes avatar-blink {
    0%, 7%, 9%, 100% { transform: scaleY(1); }
    8% { transform: scaleY(.08); }
  }

  @keyframes avatar-talk {
    from { transform: scaleY(.55); }
    to { transform: scaleY(1.25); }
  }

  @keyframes avatar-pulse {
    from { transform: scale(.96); opacity: .45; }
    to { transform: scale(1.2); opacity: 0; }
  }

  #bubble {
    position: absolute;
    z-index: 2;
    top: 10px;
    left: 10px;
    right: 10px;
    min-height: 62px;
    max-height: 112px;
    padding: 10px 12px;
    border: 1px solid rgba(23, 32, 51, .1);
    border-radius: 12px;
    background: var(--surface);
    box-shadow: 0 14px 34px rgba(17, 24, 39, .16);
    font-size: 13px;
    line-height: 1.48;
    overflow: hidden;
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity .2s ease, transform .2s ease;
    pointer-events: none;
  }

  #bubble.show {
    opacity: 1;
    transform: translateY(0);
  }

  #suggestions {
    position: absolute;
    z-index: 3;
    left: 10px;
    right: 10px;
    bottom: 70px;
    width: auto;
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    justify-content: center;
  }

  .suggestion {
    appearance: none;
    border: 1px solid rgba(37, 99, 235, .22);
    border-radius: 999px;
    background: rgba(255, 255, 255, .94);
    color: var(--accent-strong);
    box-shadow: 0 8px 20px rgba(17, 24, 39, .14);
    cursor: pointer;
    font: 700 10px/1.1 "Noto Sans TC", system-ui, sans-serif;
    padding: 6px 8px;
    max-width: 126px;
    text-align: center;
    white-space: normal;
  }

  .suggestion:hover { background: #fff; transform: translateY(-1px); }
  .suggestion:focus-visible { outline: 3px solid rgba(37, 99, 235, .3); outline-offset: 2px; }

  #control-bar {
    position: absolute;
    z-index: 4;
    right: 12px;
    bottom: 10px;
    display: flex;
    flex-direction: row;
    gap: 6px;
    align-items: center;
    width: auto;
    padding: 6px;
    border-radius: 14px;
    background: var(--panel);
    box-shadow: 0 16px 36px rgba(17, 24, 39, .26), inset 0 0 0 1px rgba(255, 255, 255, .12);
    backdrop-filter: blur(12px) saturate(1.3);
    -webkit-backdrop-filter: blur(12px) saturate(1.3);
  }

  .control {
    appearance: none;
    height: 34px;
    min-width: 42px;
    border: 0;
    border-radius: 10px;
    background: rgba(255, 255, 255, .14);
    color: #fff;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0 9px;
    font: 800 12px/1 "Noto Sans TC", system-ui, sans-serif;
    white-space: nowrap;
  }

  .control.primary {
    min-width: 62px;
    background: var(--accent);
  }

  .control:hover { background: rgba(255, 255, 255, .24); }
  .control.primary:hover { background: var(--accent-strong); }
  .control:focus-visible { outline: 3px solid rgba(255, 255, 255, .55); outline-offset: 2px; }
  .control.listening { background: var(--success); }

  @media (max-width: 420px) {
    #bubble { font-size: 12px; max-height: 104px; }
    #assistant-avatar { right: 78px; bottom: 58px; width: 198px; height: 276px; }
    #suggestions { bottom: 70px; gap: 5px; }
    .suggestion { max-width: 126px; font-size: 10px; padding: 6px 8px; }
    .control { min-width: 38px; padding: 0 8px; font-size: 12px; }
    .control.primary { min-width: 56px; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="bubble" aria-live="polite"></div>
    <button id="assistant-avatar" type="button" aria-label="讓享哥 AI 虛擬助理打招呼">
      <svg viewBox="0 0 300 400" role="img" aria-labelledby="avatar-title avatar-desc">
        <title id="avatar-title">享哥造型 2D 助理</title>
        <desc id="avatar-desc">戴眼鏡、穿西裝的享哥風格半身 2D 虛擬助理。</desc>
        <ellipse cx="150" cy="376" rx="92" ry="16" fill="rgba(17,24,39,.16)"/>
        <circle class="avatar-listen-ring" cx="150" cy="142" r="82" fill="none" stroke="#2563eb" stroke-width="7"/>
        <g class="avatar-body">
          <path d="M72 382c8-78 29-126 78-126s70 48 78 126H72z" fill="#1f2937"/>
          <path d="M92 382c6-55 24-94 58-111 34 17 52 56 58 111H92z" fill="#374151"/>
          <path d="M118 263l32 37 32-37 19 119H99l19-119z" fill="#f8fafc"/>
          <path d="M137 292l13 18 13-18 10 90h-46l10-90z" fill="#1d4ed8"/>
          <path d="M117 264l-26 42 42-8-14 22 31 62H92c5-57 12-94 25-118z" fill="#111827" opacity=".88"/>
          <path d="M183 264l26 42-42-8 14 22-31 62h58c-5-57-12-94-25-118z" fill="#111827" opacity=".88"/>
          <path d="M114 286c20 8 50 8 72 0" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" opacity=".45"/>
          <rect x="126" y="330" width="48" height="22" rx="6" fill="#0f172a" opacity=".72"/>
          <text x="150" y="346" text-anchor="middle" font-size="14" font-weight="800" fill="#fff" font-family="Noto Sans TC, sans-serif">享</text>
        </g>
        <g class="avatar-head">
          <path d="M118 246c12 18 52 18 64 0v-26h-64v26z" fill="#f1c8a8"/>
          <path d="M89 128c0-45 27-78 61-78s61 33 61 78v28c0 45-26 78-61 78s-61-33-61-78v-28z" fill="#f6d1b4"/>
          <path d="M89 134c-15-45 17-92 61-96 50-4 79 38 62 94-13-31-36-35-62-31-27 4-45 13-61 33z" fill="#26202b"/>
          <path d="M95 116c20-42 77-54 116 1-21-7-42-10-61-6-22 4-39 10-55 5z" fill="#3b3140"/>
          <path d="M116 59c-4 27 5 46 23 57-23-2-40-12-51-27 7-13 16-23 28-30z" fill="#46384a"/>
          <path d="M184 60c7 21 3 39-11 54 19-3 34-11 43-25-7-13-18-23-32-29z" fill="#352a38"/>
          <path d="M90 145c-14 0-23 13-18 31 4 15 14 23 25 18" fill="#f1c8a8"/>
          <path d="M210 145c14 0 23 13 18 31-4 15-14 23-25 18" fill="#f1c8a8"/>
          <path d="M111 131c12-9 27-9 39 0" fill="none" stroke="#3b3140" stroke-width="6" stroke-linecap="round"/>
          <path d="M150 131c12-9 27-9 39 0" fill="none" stroke="#3b3140" stroke-width="6" stroke-linecap="round"/>
          <g fill="#172033">
            <ellipse class="avatar-eye" cx="128" cy="149" rx="5.4" ry="7.5"/>
            <ellipse class="avatar-eye" cx="172" cy="149" rx="5.4" ry="7.5"/>
          </g>
          <path d="M142 169c5 3 11 3 16 0" fill="none" stroke="#d09a7d" stroke-width="4" stroke-linecap="round"/>
          <path d="M127 189c13 9 33 9 46 0" fill="none" stroke="#b25f5f" stroke-width="4" stroke-linecap="round" class="avatar-mouth avatar-mouth-closed"/>
          <ellipse cx="150" cy="191" rx="14" ry="8" fill="#8f3e46" class="avatar-mouth avatar-mouth-open"/>
          <path d="M108 139h36c7 0 12 5 12 12v6c0 8-6 13-14 13h-27c-8 0-14-6-14-14v-10c0-4 3-7 7-7z" fill="none" stroke="#172033" stroke-width="4"/>
          <path d="M156 139h36c4 0 7 3 7 7v10c0 8-6 14-14 14h-27c-8 0-14-5-14-13v-6c0-7 5-12 12-12z" fill="none" stroke="#172033" stroke-width="4"/>
          <path d="M145 152h10" fill="none" stroke="#172033" stroke-width="4" stroke-linecap="round"/>
          <path d="M104 119c18-22 57-30 97-3" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="5" stroke-linecap="round"/>
        </g>
      </svg>
    </button>
    <div id="suggestions" aria-label="常見問題"></div>
    <div id="control-bar" role="toolbar" aria-label="享哥 AI 虛擬助理控制列">
      <button class="control primary" id="btn-mic" type="button">說話</button>
      <button class="control" id="btn-mute" type="button" aria-pressed="false">聲音</button>
      <button class="control" id="btn-speed" type="button">1.0x</button>
      <button class="control" id="btn-close" type="button">關閉</button>
    </div>
  </div>

  <script src="knowledge.js"></script>
  <script>
    (function () {
      'use strict';

      var query = new URLSearchParams(window.location.search);
      var KNOWLEDGE_URL = query.get('knowledge') || '';
      var VOICE_HINT = query.get('voice') || 'male';
      var kb = Array.isArray(window.HSIANG_AVATAR_KB) ? window.HSIANG_AVATAR_KB : [];
      var isSpeaking = false;
      var muted = false;
      var ttsRate = 1;
      var selectedVoice = null;
      var recognition = null;
      var listening = false;
      var SpeechRecognitionApi = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (KNOWLEDGE_URL) {
        fetch(KNOWLEDGE_URL)
          .then(function (response) { return response.ok ? response.json() : null; })
          .then(function (items) { if (Array.isArray(items)) kb = items; })
          .catch(function () {});
      }

      function post(type, payload) {
        try {
          window.parent.postMessage(Object.assign({ ns: 'hsiang-avatar', type: type }, payload || {}), '*');
        } catch (error) {}
      }

      function showBubble(text, timeout) {
        var bubble = document.getElementById('bubble');
        bubble.textContent = text;
        bubble.classList.add('show');
        window.clearTimeout(showBubble.timer);
        showBubble.timer = window.setTimeout(function () {
          bubble.classList.remove('show');
        }, timeout || 7200);
      }

      function normalize(text) {
        return String(text || '').toLowerCase().replace(/[\s，。、？！,.?!：:；;「」『』（）()]/g, '');
      }

      function bigrams(text) {
        var source = normalize(text);
        var grams = [];
        if (!source) return grams;
        if (source.length === 1) return [source];
        for (var i = 0; i < source.length - 1; i += 1) grams.push(source.slice(i, i + 2));
        return grams;
      }

      function similarity(queryText, targetText) {
        var a = bigrams(queryText);
        var b = new Set(bigrams(targetText));
        if (!a.length || !b.size) return 0;
        var hits = 0;
        a.forEach(function (gram) { if (b.has(gram)) hits += 1; });
        return hits / Math.sqrt(a.length * b.size);
      }

      function scoreEntry(text, entry) {
        var score = Math.max(similarity(text, entry.q), similarity(text, entry.kw || ''));
        var queryText = normalize(text);
        String(entry.kw || '').split(/\s+/).forEach(function (term) {
          if (term.length >= 2 && queryText.indexOf(normalize(term)) !== -1) {
            score = Math.max(score, .52 + Math.min(term.length * .035, .25));
          }
        });
        return score;
      }

      function answer(text) {
        var trimmed = String(text || '').trim();
        var best = null;
        var bestScore = 0;
        if (!trimmed) return '我好像沒有聽清楚，可以再說一次嗎？';
        kb.forEach(function (entry) {
          var score = scoreEntry(trimmed, entry);
          if (score > bestScore) {
            best = entry;
            bestScore = score;
          }
        });
        if (best && bestScore >= .14) return best.a;
        return '這題我目前還沒有完整資料。你可以先問我 AI 顧問、n8n 自動化、企業內訓、費用或預約諮詢。';
      }

      function loadVoice() {
        if (!('speechSynthesis' in window)) return;
        var voices = window.speechSynthesis.getVoices();
        var preferredTaiwanMaleNames = ['Eddy', 'Grandpa', 'Rocko', 'Reed', 'YunJhe', '雲哲', 'Zhiwei', 'Kangkang'];
        var fallbackTaiwanMale = /Eddy|Microsoft|Male|男/i;
        var femaleVoice = /Hsiao|Xiao|Yating|HanHan|MeiJia|Meijia|美佳|Flo|Grandma|Sandy|Shelley|Female|女/i;
        function findVoiceByNames(langPattern, names) {
          for (var i = 0; i < names.length; i += 1) {
            var pattern = new RegExp(names[i], 'i');
            var found = voices.find(function (voice) {
              return langPattern.test(voice.lang) && pattern.test(voice.name) && !femaleVoice.test(voice.name);
            });
            if (found) return found;
          }
          return null;
        }
        selectedVoice =
          voices.find(function (voice) { return VOICE_HINT !== 'male' && new RegExp(VOICE_HINT, 'i').test(voice.name + ' ' + voice.lang); }) ||
          findVoiceByNames(/zh[-_]TW/i, preferredTaiwanMaleNames) ||
          findVoiceByNames(/^zh/i, preferredTaiwanMaleNames) ||
          voices.find(function (voice) { return /zh[-_]TW/i.test(voice.lang) && fallbackTaiwanMale.test(voice.name) && !femaleVoice.test(voice.name); }) ||
          voices.find(function (voice) { return /zh[-_]TW/i.test(voice.lang); }) ||
          voices.find(function (voice) { return /zh/i.test(voice.lang); }) ||
          voices.find(function (voice) { return voice.lang === VOICE_HINT; }) ||
          null;
        window.__selectedVoiceName = selectedVoice ? selectedVoice.name + ' / ' + selectedVoice.lang : '';
      }

      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = loadVoice;
        loadVoice();
      }

      function stopSpeaking() {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        window.clearInterval(speak.poller);
        isSpeaking = false;
        document.body.classList.remove('speaking');
      }

      function speak(text) {
        showBubble(text);
        if (muted || !('speechSynthesis' in window)) return;
        stopSpeaking();
        var utterance = new SpeechSynthesisUtterance(text);
        if (!selectedVoice) loadVoice();
        if (selectedVoice) utterance.voice = selectedVoice;
        utterance.lang = selectedVoice ? selectedVoice.lang : 'zh-TW';
        utterance.rate = Math.max(.9, ttsRate * .95);
        utterance.pitch = .95;
        utterance.onend = function () {
          isSpeaking = false;
          document.body.classList.remove('speaking');
          window.clearInterval(speak.poller);
        };
        window.speechSynthesis.speak(utterance);
        isSpeaking = true;
        document.body.classList.add('speaking');
        var startedAt = performance.now();
        speak.poller = window.setInterval(function () {
          var active = window.speechSynthesis.speaking || window.speechSynthesis.pending;
          if ((performance.now() - startedAt > 900 && !active) || performance.now() - startedAt > 18000) {
            isSpeaking = false;
            document.body.classList.remove('speaking');
            window.clearInterval(speak.poller);
          }
        }, 160);
      }

      function handleUserText(text) {
        var clean = String(text || '').trim();
        if (clean) showBubble('你：' + clean, 2400);
        window.setTimeout(function () { speak(answer(clean)); }, 180);
      }

      function setMicState(active) {
        var button = document.getElementById('btn-mic');
        var suggestions = document.getElementById('suggestions');
        listening = active;
        document.body.classList.toggle('listening', active);
        button.classList.toggle('listening', active);
        button.textContent = active ? '聆聽中' : '說話';
        suggestions.style.display = active ? 'none' : 'flex';
      }

      function startListening() {
        if (!SpeechRecognitionApi) {
          speak('你的瀏覽器目前不支援語音辨識。建議使用 Chrome 桌機版，或直接點下方常見問題。');
          return;
        }
        if (listening && recognition) {
          recognition.stop();
          return;
        }
        try {
          recognition = new SpeechRecognitionApi();
        } catch (error) {
          speak('語音辨識啟動失敗，請改用 Chrome 桌機版再試一次。');
          return;
        }
        recognition.lang = 'zh-TW';
        recognition.interimResults = true;
        recognition.continuous = false;
        recognition.maxAlternatives = 1;
        recognition.onstart = function () {
          setMicState(true);
          showBubble('正在聆聽。Chrome 可能會使用瀏覽器廠商雲端處理語音，本站不會自行儲存你的語音內容。', 9000);
        };
        recognition.onresult = function (event) {
          var text = '';
          for (var i = 0; i < event.results.length; i += 1) text += event.results[i][0].transcript;
          var last = event.results[event.results.length - 1];
          if (last.isFinal) handleUserText(text);
          else showBubble('你：' + text, 2600);
        };
        recognition.onerror = function (event) {
          setMicState(false);
          showBubble(event.error === 'not-allowed' ? '需要允許麥克風權限，我才能聽你說話。' : '剛剛沒有聽清楚，可以再試一次。');
        };
        recognition.onend = function () { setMicState(false); };
        recognition.start();
      }

      function renderSuggestions() {
        var box = document.getElementById('suggestions');
        var items = ['享哥提供哪些服務', 'n8n 可以做什麼', '怎麼預約諮詢', '費用怎麼算'];
        items.forEach(function (item) {
          var button = document.createElement('button');
          button.type = 'button';
          button.className = 'suggestion';
          button.textContent = item;
          button.addEventListener('click', function () { handleUserText(item); });
          box.appendChild(button);
        });
      }

      function resizeAvatar() {
        window.__avatarLayout = {
          width: document.getElementById('stage').clientWidth,
          height: document.getElementById('stage').clientHeight
        };
      }

      document.getElementById('btn-close').addEventListener('click', function () {
        stopSpeaking();
        post('close');
      });
      document.getElementById('btn-mic').addEventListener('click', startListening);
      document.getElementById('btn-mute').addEventListener('click', function () {
        muted = !muted;
        this.textContent = muted ? '靜音' : '聲音';
        this.setAttribute('aria-pressed', String(muted));
        if (muted) stopSpeaking();
        showBubble(muted ? '已靜音。' : '已恢復語音。');
      });
      document.getElementById('btn-speed').addEventListener('click', function () {
        var steps = [.9, 1, 1.15, 1.3];
        var current = steps.indexOf(ttsRate);
        ttsRate = steps[(current + 1) % steps.length] || 1;
        this.textContent = ttsRate.toFixed(1) + 'x';
        showBubble('語速已調整為 ' + ttsRate.toFixed(1) + ' 倍。');
      });
      document.getElementById('assistant-avatar').addEventListener('click', function () {
        speak('你好，我是享哥的 AI 虛擬助理。你可以問我服務內容、企業內訓或自動化流程。');
      });
      window.addEventListener('message', function (event) {
        var data = event.data || {};
        if (data.ns === 'hsiang-avatar-host' && data.type === 'say') speak(String(data.text || '').slice(0, 500));
        if (data.ns === 'hsiang-avatar-host' && data.type === 'open') {
          window.requestAnimationFrame(function () {
            resizeAvatar();
            window.setTimeout(resizeAvatar, 160);
          });
        }
      });

      renderSuggestions();
      window.__avatarModel = { type: 'svg-assistant', brand: 'hsiang' };
      window.__resizeAvatar = resizeAvatar;
      resizeAvatar();
      window.addEventListener('resize', resizeAvatar);
      window.setTimeout(function () {
        showBubble('你好，我是享哥的 AI 虛擬助理。可以先問我服務內容、n8n 自動化、費用或預約諮詢。', 8200);
      }, 600);
    })();
  </script>
</body>
</html>
